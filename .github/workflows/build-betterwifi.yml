name: Build BetterWiFi RH

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi.yml'
      - 'bwrh-031.part*'
      - 'patch_bwrh_032.py'
      - 'p035_*.b64'
      - 'patch_monitor_035.py'
      - 'patch_cleanup_035.py'
      - 'p036_*.b64'
      - 'patch_bwrh_037.py'
      - 'patch_bwrh_038.py'
      - 'patch_bwrh_039.py'
      - 'patch_bwrh_040.py'
      - 'patch_bwrh_041.py'
      - 'patch_bwrh_042.py'
      - 'patch_bwrh_044_permissions.py'
      - 'patch_bwrh_045_arm64e_build.py'
      - 'patch_bwrh_046_split_packages.py'
      - 'patch_bwrh_047_no_migration.py'
      - 'patch_bwrh_048_translation_icon.py'
      - 'patch_bwrh_049_generic_icon.py'
      - 'betterwifi_generic_icon.b64'
      - 'validate_bwrh_arm64e.py'
      - 'credits_avatar.b64'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore BetterWiFi RH 1.0
        shell: bash
        run: |
          set -euo pipefail

          cat bwrh-031.part0 bwrh-031.part1 bwrh-031.part2 bwrh-031.part3a bwrh-031.part3b bwrh-031.part4a bwrh-031.part4b > project.tar.gz.b64
          test "$(wc -c < project.tar.gz.b64 | tr -d ' ')" = "23080"
          test "$(shasum -a 256 project.tar.gz.b64 | awk '{print $1}')" = "06d45c36c480590e763fd562fabb358a31fced1ae94dd3890976bee02181f561"
          base64 -D -i project.tar.gz.b64 -o project.tar.gz
          tar -tzf project.tar.gz >/dev/null
          tar -xzf project.tar.gz

          python3 patch_bwrh_032.py

          cat p035_0.b64 p035_1.b64 p035_2.b64 p035_3.b64 p035_4.b64 p035_5.b64 > patch_bwrh_035.diff.b64
          test "$(shasum -a 256 patch_bwrh_035.diff.b64 | awk '{print $1}')" = "9adf44526709a0c312390d0f0ea230b2e860999df462e146ce8c66d8cee6e58b"
          base64 -D -i patch_bwrh_035.diff.b64 -o patch_bwrh_035.diff
          test "$(shasum -a 256 patch_bwrh_035.diff | awk '{print $1}')" = "c1bef8d4ebd045787c95885a22630837bf5dcfdfc8a4db6f40389ae7ec64d874"

          cd BetterWiFi-RH
          patch -p0 < ../patch_bwrh_035.diff || true
          test -f Tweak.xm.rej
          test "$(grep -c '^@@' Tweak.xm.rej)" = "1"
          grep -q 'sampleSignal' Tweak.xm.rej
          cd ..
          python3 patch_monitor_035.py
          python3 patch_cleanup_035.py

          cd BetterWiFi-RH
          rm -f Tweak.xm.rej
          sed -i '' 's/^Version: 0.3.2$/Version: 0.3.5/' control
          python3 - <<'PY035'
          import plistlib
          from pathlib import Path
          p=Path('prefs/Resources/Info.plist')
          x=plistlib.loads(p.read_bytes())
          x['CFBundleShortVersionString']='0.3.5'
          x['CFBundleVersion']='8'
          p.write_bytes(plistlib.dumps(x,fmt=plistlib.FMT_XML,sort_keys=False))
          PY035
          grep -q '^Version: 0.3.5$' control

          cd ..
          cat p036_0.b64 p036_1.b64 p036_2.b64 > patch_bwrh_036.diff.b64
          test "$(shasum -a 256 patch_bwrh_036.diff.b64 | awk '{print $1}')" = "65bb06f7649aaeb76fd66bff32d1fa0a5b610c0e9cfe439b8efcd4454140a482"
          base64 -D -i patch_bwrh_036.diff.b64 -o patch_bwrh_036.diff
          test "$(shasum -a 256 patch_bwrh_036.diff | awk '{print $1}')" = "5ff85fd66bd0b85b3b53659fc1aa05cc77ae503fab0e39fa9556dee0b2770d59"

          cd BetterWiFi-RH
          patch -p1 < ../patch_bwrh_036.diff
          sed -i '' 's/^Version: 0.3.5$/Version: 0.3.6/' control
          python3 - <<'PY036'
          import plistlib
          from pathlib import Path
          info_path=Path('prefs/Resources/Info.plist')
          info=plistlib.loads(info_path.read_bytes())
          info['CFBundleShortVersionString']='0.3.6'
          info['CFBundleVersion']='9'
          info_path.write_bytes(plistlib.dumps(info,fmt=plistlib.FMT_XML,sort_keys=False))

          root_path=Path('prefs/Resources/Root.plist')
          root=plistlib.loads(root_path.read_bytes())
          changed=0
          for spec in root.get('items',[]):
              if spec.get('defaults')=='com.betterwifirh.preferences' and spec.get('key'):
                  spec['PostNotification']='com.betterwifirh.preferences.changed'
                  changed+=1
          if changed < 20:
              raise SystemExit(f'expected >=20 preference specifiers, found {changed}')
          root_path.write_bytes(plistlib.dumps(root,fmt=plistlib.FMT_XML,sort_keys=False))
          PY036
          grep -q '^Version: 0.3.6$' control
          grep -q 'BWRHApplyListPreferences' Tweak.xm

          cd ..
          python3 patch_bwrh_037.py
          cd BetterWiFi-RH
          grep -q '^Version: 0.3.7$' control
          grep -q 'WiFiDeviceClientScanCancel' Tweak.xm
          grep -q 'BWRHMWUnregisterLQM' Tweak.xm
          grep -q 'dispatch_source_create' Tweak.xm

          cd ..
          python3 patch_bwrh_038.py
          cd BetterWiFi-RH
          echo "CONTROL_VERSION=$(grep '^Version:' control)"
          grep -n 'BWRHIsNativeWiFiKitSnapshotObject' Tweak.xm | head
          grep -n 'isInstantHotspot' Tweak.xm | head
          echo "ANALYZER_BLOCK:"
          grep -n -A6 'self.scanSource = @"MobileWiFi directo"' Tweak.xm | head -12 || true
          test "$(grep '^Version:' control)" = "Version: 0.3.8"
          grep -q 'BWRHIsNativeWiFiKitSnapshotObject' Tweak.xm
          grep -q 'isInstantHotspot' Tweak.xm
          if grep -A5 'self.scanSource = @"MobileWiFi directo"' Tweak.xm | grep -q 'BWRHStoreNetworkSnapshot(results)'; then
            echo "MobileWiFi analyzer still contaminates native snapshot" >&2
            exit 1
          fi
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.8 source verified."

          cd ..
          python3 patch_bwrh_039.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.9"
          grep -q 'BWRHLanguageMode' Tweak.xm
          grep -q 'BWRHSystemUsesSpanish' Tweak.xm
          grep -q 'PSLinkListCell' prefs/Resources/Root.plist
          grep -q 'language' prefs/Resources/Root.plist
          grep -q 'BWRHPrefsLanguageMode' prefs/BWRHRootListController.m
          grep -q 'setPreferenceValue:' prefs/BWRHRootListController.m
          grep -q '"Language" = "Idioma";' prefs/Resources/es.lproj/Root.strings
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.9 language selector source verified."

          cd ..
          python3 patch_bwrh_040.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.10"
          grep -q 'PSSegmentCell' prefs/Resources/Root.plist
          ! grep -q 'PSLinkListCell' prefs/Resources/Root.plist || true
          grep -q 'dispatch_async(dispatch_get_main_queue()' prefs/BWRHRootListController.m
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.10 inline language selector source verified."

          cd ..
          python3 patch_bwrh_041.py
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 0.3.11"
          test -s prefs/Resources/CreditsAvatar.jpg
          grep -q 'Gokuencinar · GokuEn' prefs/BWRHRootListController.m
          grep -q 'https://github.com/Gokuencinar/GokuEnREPO' prefs/BWRHRootListController.m
          grep -q 'https://buymeacoffee.com/gokuen' prefs/BWRHRootListController.m
          grep -q 'bwrh_installCreditsFooter' prefs/BWRHRootListController.m
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 0.3.11 credits source verified."

          cd ..
          python3 patch_bwrh_042.py
          python3 patch_bwrh_044_permissions.py
          python3 patch_bwrh_045_arm64e_build.py
          python3 patch_bwrh_046_split_packages.py
          python3 patch_bwrh_047_no_migration.py
          python3 patch_bwrh_048_translation_icon.py
          python3 patch_bwrh_049_generic_icon.py
          base64 -D -i betterwifi_generic_icon.b64 -o BetterWiFi-RH/prefs/Resources/icon.png
          cd BetterWiFi-RH
          test "$(grep '^Version:' control)" = "Version: 1.0"
          grep -q '^Package: com.betterwifirh.tweak.roothide$' control
          grep -q 'constant:8.0' prefs/BWRHRootListController.m
          grep -q 'insideAdvancedFilters' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Band filter"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Network type"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Minimum signal filter"' prefs/BWRHRootListController.m
          grep -q 'specifier.name = @"Sort networks"' prefs/BWRHRootListController.m
          grep -q 'BWRHSetPreferenceTitles' prefs/BWRHRootListController.m
          grep -q 'specifier.titleDictionary = titleDictionary' prefs/BWRHRootListController.m
          grep -q 'icon = "icon.png";' layout/Library/PreferenceLoader/Preferences/BetterWiFiRH.plist
          test -s prefs/Resources/icon.png
          test "$(sips -g pixelWidth prefs/Resources/icon.png | awk '/pixelWidth/ {print $2}')" = "87"
          test "$(sips -g pixelHeight prefs/Resources/icon.png | awk '/pixelHeight/ {print $2}')" = "87"
          plutil -lint prefs/Resources/Root.plist
          plutil -lint prefs/Resources/Info.plist
          echo "BetterWiFi RH 1.0 translation + smaller generic icon source verified."

      - name: Archive prepared 1.0 source
        shell: bash
        run: |
          tar -czf BetterWiFi-RH-1.0-source.tar.gz BetterWiFi-RH

      - name: Upload prepared source
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-1.0-source
          path: BetterWiFi-RH-1.0-source.tar.gz
          if-no-files-found: error

      - name: Setup RootHide Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'roothide/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build RootHide package
        shell: bash
        run: |
          cd BetterWiFi-RH
          umask 022
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -lh packages/*.deb

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-1.0-RootHide
          path: BetterWiFi-RH/packages/*.deb
          if-no-files-found: error


  build-rootless:
    name: Build Dopamine rootless (iOS 15-18)
    needs: build
    runs-on: macos-15
    steps:
      - name: Checkout build helpers
        uses: actions/checkout@v4

      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: BetterWiFi-RH-1.0-source

      - name: Extract source and adapt compatibility
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf BetterWiFi-RH-1.0-source.tar.gz
          find BetterWiFi-RH -name Makefile -type f -print0 | while IFS= read -r -d '' f; do
            sed -i '' -E '/THEOS_PACKAGE_SCHEME[[:space:]]*[:?+]?=[[:space:]]*roothide/d' "$f"
            sed -i '' -E '/PACKAGE_ARCH[[:space:]]*[:?+]?=[[:space:]]*iphoneos-arm64e/d' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("BetterWiFi-RH")
          control=root/"control"
          s=control.read_text()
          s=re.sub(r'^Package:.*$', 'Package: com.betterwifirh.tweak.dopamine', s, flags=re.M)
          s=re.sub(r'^Name:.*$', 'Name: BetterWiFi RH (Dopamine)', s, flags=re.M)
          s=re.sub(r'^Depends:.*$', 'Depends: firmware (>= 15.0), firmware (<< 19.0), preferenceloader', s, flags=re.M)
          s=re.sub(r'^Architecture:.*$', 'Architecture: iphoneos-arm64', s, flags=re.M)
          s=re.sub(r'^Conflicts:.*$', 'Conflicts: com.betterwifirh.tweak, com.betterwifirh.tweak.roothide, com.betterwifirh.tweak.rootful', s, flags=re.M)
          control.write_text(s)

          tweak=root/"Tweak.xm"
          s=tweak.read_text()
          pattern=r'(%ctor\s*\{\s*@autoreleasepool\s*\{\s*)if \(@available\(iOS 16\.0, \*\)\)'
          s2,n=re.subn(pattern, r'\1if (@available(iOS 15.0, *))', s, count=1)
          if n != 1:
              raise SystemExit(f'expected one iOS16 ctor gate, replaced {n}')
          tweak.write_text(s2)
          PY
          grep -q '^Version: 1.0$' BetterWiFi-RH/control
          grep -q '^Package: com.betterwifirh.tweak.dopamine$' BetterWiFi-RH/control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 19.0), preferenceloader$' BetterWiFi-RH/control
          grep -q '^Architecture: iphoneos-arm64$' BetterWiFi-RH/control
          grep -q '@available(iOS 15.0, \*)' BetterWiFi-RH/Tweak.xm

      - name: Setup standard Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build Dopamine rootless package
        shell: bash
        run: |
          set -euo pipefail
          cd BetterWiFi-RH
          umask 022
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e"
          deb="$(find packages -name '*.deb' -type f | head -1)"
          test -n "$deb"

          dylib=".theos/_/var/jb/Library/MobileSubstrate/DynamicLibraries/BetterWiFiRH.dylib"
          prefs=".theos/_/var/jb/Library/PreferenceBundles/BetterWiFiRHPrefs.bundle/BetterWiFiRHPrefs"
          test -f "$dylib"
          test -f "$prefs"
          test "$(stat -f '%Lp' "$dylib")" = "755"
          test "$(stat -f '%Lp' "$prefs")" = "755"
          python3 ../validate_bwrh_arm64e.py "$dylib" "$prefs"
          lipo -archs "$dylib"
          lipo -archs "$prefs"
          otool -L "$dylib"
          otool -L "$prefs"
          codesign -dvv "$dylib" 2>&1 | head -20 || true
          codesign -dvv "$prefs" 2>&1 | head -20 || true

          grep -q '^Package: com.betterwifirh.tweak.dopamine$' control
          grep -q '^Version: 1.0$' control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 19.0), preferenceloader$' control

          mkdir -p ../out-rootless
          cp "$deb" ../out-rootless/com.betterwifirh.tweak.dopamine_1.0_iphoneos-arm64.deb

      - name: Upload Dopamine rootless deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-1.0-Dopamine
          path: out-rootless/com.betterwifirh.tweak.dopamine_1.0_iphoneos-arm64.deb
          if-no-files-found: error

  build-rootful:
    name: Build rootful (iOS 15-17)
    needs: build
    runs-on: macos-15
    steps:
      - name: Download prepared source
        uses: actions/download-artifact@v4
        with:
          name: BetterWiFi-RH-1.0-source

      - name: Extract source and adapt compatibility
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf BetterWiFi-RH-1.0-source.tar.gz
          find BetterWiFi-RH -name Makefile -type f -print0 | while IFS= read -r -d '' f; do
            sed -i '' -E '/THEOS_PACKAGE_SCHEME[[:space:]]*[:?+]?=[[:space:]]*roothide/d' "$f"
            sed -i '' -E '/PACKAGE_ARCH[[:space:]]*[:?+]?=[[:space:]]*iphoneos-arm64e/d' "$f"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("BetterWiFi-RH")
          control=root/"control"
          s=control.read_text()
          s=re.sub(r'^Package:.*$', 'Package: com.betterwifirh.tweak.rootful', s, flags=re.M)
          s=re.sub(r'^Name:.*$', 'Name: BetterWiFi RH (Rootful)', s, flags=re.M)
          s=re.sub(r'^Depends:.*$', 'Depends: firmware (>= 15.0), firmware (<< 18.0), preferenceloader', s, flags=re.M)
          s=re.sub(r'^Architecture:.*$', 'Architecture: iphoneos-arm', s, flags=re.M)
          s=re.sub(r'^Conflicts:.*$', 'Conflicts: com.betterwifirh.tweak, com.betterwifirh.tweak.roothide, com.betterwifirh.tweak.dopamine', s, flags=re.M)
          control.write_text(s)

          tweak=root/"Tweak.xm"
          s=tweak.read_text()
          pattern=r'(%ctor\s*\{\s*@autoreleasepool\s*\{\s*)if \(@available\(iOS 16\.0, \*\)\)'
          s2,n=re.subn(pattern, r'\1if (@available(iOS 15.0, *))', s, count=1)
          if n != 1:
              raise SystemExit(f'expected one iOS16 ctor gate, replaced {n}')
          tweak.write_text(s2)
          PY
          grep -q '^Version: 1.0$' BetterWiFi-RH/control
          grep -q '^Package: com.betterwifirh.tweak.rootful$' BetterWiFi-RH/control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 18.0), preferenceloader$' BetterWiFi-RH/control
          grep -q '^Architecture: iphoneos-arm$' BetterWiFi-RH/control
          grep -q '@available(iOS 15.0, \*)' BetterWiFi-RH/Tweak.xm

      - name: Setup standard Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'theos/theos'
          theos-branch: 'master'
          sdks-src: 'theos/sdks'
          sdks-branch: 'master'

      - name: Build rootful package
        shell: bash
        run: |
          set -euo pipefail
          cd BetterWiFi-RH
          umask 022
          make clean package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0 ARCHS="arm64"
          deb="$(find packages -name '*.deb' -type f | head -1)"
          test -n "$deb"
          grep -q '^Package: com.betterwifirh.tweak.rootful$' control
          grep -q '^Version: 1.0$' control
          grep -q '^Depends: firmware (>= 15.0), firmware (<< 18.0), preferenceloader$' control
          mkdir -p ../out-rootful
          cp "$deb" ../out-rootful/com.betterwifirh.tweak.rootful_1.0_iphoneos-arm.deb
          file .theos/obj/debug/BetterWiFiRH.dylib 2>/dev/null || true

      - name: Upload rootful deb
        uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-1.0-Rootful
          path: out-rootful/com.betterwifirh.tweak.rootful_1.0_iphoneos-arm.deb
          if-no-files-found: error
