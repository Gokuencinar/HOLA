name: Build BetterWiFi RH Linux variants

on:
  push:
    paths:
      - '.github/workflows/build-betterwifi-linux.yml'
      - 'bwrh-031.part*'
      - 'patch_bwrh_032.py'
      - 'p035_*.b64'
      - 'patch_monitor_035.py'
      - 'patch_cleanup_035.py'
      - 'p036_*.b64'
      - 'patch_bwrh_037.py'
      - 'patch_bwrh_038.py'
      - 'patch_bwrh_039.py'
      - 'patch_bwrh_040.py'
      - 'patch_bwrh_041.py'
      - 'patch_bwrh_042.py'
      - 'patch_bwrh_044_permissions.py'
      - 'patch_bwrh_043_multijailbreak.py'
      - 'credits_avatar.b64'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct 0.3.13 source
        shell: bash
        run: |
          set -euo pipefail
          cat bwrh-031.part0 bwrh-031.part1 bwrh-031.part2 bwrh-031.part3a bwrh-031.part3b bwrh-031.part4a bwrh-031.part4b > project.tar.gz.b64
          test "$(wc -c < project.tar.gz.b64 | tr -d ' ')" = "23080"
          test "$(sha256sum project.tar.gz.b64 | awk '{print $1}')" = "06d45c36c480590e763fd562fabb358a31fced1ae94dd3890976bee02181f561"
          base64 -d project.tar.gz.b64 > project.tar.gz
          tar -xzf project.tar.gz

          python3 patch_bwrh_032.py

          cat p035_0.b64 p035_1.b64 p035_2.b64 p035_3.b64 p035_4.b64 p035_5.b64 > patch_bwrh_035.diff.b64
          test "$(sha256sum patch_bwrh_035.diff.b64 | awk '{print $1}')" = "9adf44526709a0c312390d0f0ea230b2e860999df462e146ce8c66d8cee6e58b"
          base64 -d patch_bwrh_035.diff.b64 > patch_bwrh_035.diff

          cd BetterWiFi-RH
          patch -p0 < ../patch_bwrh_035.diff || true
          test -f Tweak.xm.rej
          test "$(grep -c '^@@' Tweak.xm.rej)" = "1"
          grep -q 'sampleSignal' Tweak.xm.rej
          cd ..
          python3 patch_monitor_035.py
          python3 patch_cleanup_035.py

          cd BetterWiFi-RH
          rm -f Tweak.xm.rej
          sed -i 's/^Version: 0.3.2$/Version: 0.3.5/' control
          python3 - <<'PY035'
          import plistlib
          from pathlib import Path
          p=Path('prefs/Resources/Info.plist')
          x=plistlib.loads(p.read_bytes())
          x['CFBundleShortVersionString']='0.3.5'
          x['CFBundleVersion']='8'
          p.write_bytes(plistlib.dumps(x,fmt=plistlib.FMT_XML,sort_keys=False))
          PY035

          cd ..
          cat p036_0.b64 p036_1.b64 p036_2.b64 > patch_bwrh_036.diff.b64
          base64 -d patch_bwrh_036.diff.b64 > patch_bwrh_036.diff
          cd BetterWiFi-RH
          patch -p1 < ../patch_bwrh_036.diff
          sed -i 's/^Version: 0.3.5$/Version: 0.3.6/' control
          python3 - <<'PY036'
          import plistlib
          from pathlib import Path
          info_path=Path('prefs/Resources/Info.plist')
          info=plistlib.loads(info_path.read_bytes())
          info['CFBundleShortVersionString']='0.3.6'
          info['CFBundleVersion']='9'
          info_path.write_bytes(plistlib.dumps(info,fmt=plistlib.FMT_XML,sort_keys=False))
          root_path=Path('prefs/Resources/Root.plist')
          root=plistlib.loads(root_path.read_bytes())
          for spec in root.get('items',[]):
              if spec.get('defaults')=='com.betterwifirh.preferences' and spec.get('key'):
                  spec['PostNotification']='com.betterwifirh.preferences.changed'
          root_path.write_bytes(plistlib.dumps(root,fmt=plistlib.FMT_XML,sort_keys=False))
          PY036

          cd ..
          python3 patch_bwrh_037.py
          python3 patch_bwrh_038.py
          python3 patch_bwrh_039.py
          python3 patch_bwrh_040.py
          python3 patch_bwrh_041.py
          python3 patch_bwrh_042.py
          python3 patch_bwrh_044_permissions.py

          test "$(grep '^Version:' BetterWiFi-RH/control)" = "Version: 0.3.13"
          grep -q 'constant:8.0' BetterWiFi-RH/prefs/BWRHRootListController.m
          grep -q 'insideAdvancedFilters' BetterWiFi-RH/prefs/BWRHRootListController.m

          tar -czf BetterWiFi-RH-0.3.13-source.tar.gz BetterWiFi-RH
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.13-source-linux
          path: BetterWiFi-RH-0.3.13-source.tar.gz

  rootless:
    name: Dopamine rootless iOS 15-18
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.13-source-linux
      - name: Install Theos for Linux
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          export CI=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Adapt and build rootless
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf BetterWiFi-RH-0.3.13-source.tar.gz
          python3 patch_bwrh_043_multijailbreak.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('BetterWiFi-RH/control')
          s=p.read_text()
          s=re.sub(r'^Depends:.*$', 'Depends: firmware (>= 15.0), firmware (<< 19.0), preferenceloader', s, flags=re.M)
          p.write_text(s)
          PY
          cd BetterWiFi-RH
          umask 022
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e"
          deb="$(find packages -name '*.deb' -type f | head -1)"
          test "$(dpkg-deb -f "$deb" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.13"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          mkdir -p ../out
          cp "$deb" ../out/com.betterwifirh.tweak_0.3.13_iphoneos-arm64.deb
          dpkg-deb -f "$deb" Package Version Architecture Depends
          sha256sum ../out/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-0.3.13-Dopamine-Rootless-iOS15-18
          path: out/com.betterwifirh.tweak_0.3.13_iphoneos-arm64.deb

  rootful:
    name: Rootful iOS 15-17
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BetterWiFi-RH-0.3.13-source-linux
      - name: Install Theos for Linux
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$GITHUB_WORKSPACE/theos"
          export CI=1
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
      - name: Adapt and build rootful
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf BetterWiFi-RH-0.3.13-source.tar.gz
          python3 patch_bwrh_043_multijailbreak.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('BetterWiFi-RH/control')
          s=p.read_text()
          s=re.sub(r'^Depends:.*$', 'Depends: firmware (>= 15.0), firmware (<< 18.0), preferenceloader', s, flags=re.M)
          p.write_text(s)
          PY
          cd BetterWiFi-RH
          umask 022
          make clean package FINALPACKAGE=1 TARGET=iphone:clang:latest:15.0 ARCHS="arm64 arm64e"
          deb="$(find packages -name '*.deb' -type f | head -1)"
          test "$(dpkg-deb -f "$deb" Package)" = "com.betterwifirh.tweak"
          test "$(dpkg-deb -f "$deb" Version)" = "0.3.13"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm"
          mkdir -p ../out
          cp "$deb" ../out/com.betterwifirh.tweak_0.3.13_iphoneos-arm.deb
          dpkg-deb -f "$deb" Package Version Architecture Depends
          sha256sum ../out/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: BetterWiFi-0.3.13-Rootful-iOS15-17
          path: out/com.betterwifirh.tweak_0.3.13_iphoneos-arm.deb
